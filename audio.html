<style>
:root{ --bg:#0d0d0f; --card:#151519; --border:#28282f; --text:#f4f4f6; --accent:#6675ff; --muted:#a5a5ae; --green:#55d98a; --red:#ff6666; }

body{ margin:0; background: radial-gradient(circle at top,#171725 0,#0d0d0f 45%); color:var(--text); font-family: Inter, system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.card{ background: linear-gradient(180deg,#17171c,#121216); border:1px solid var(--border); border-radius:18px; padding:30px 24px; text-align:center; max-width:500px; width:100%; box-shadow:0 12px 35px rgba(0,0,0,.3); }
.brand{ display:inline-flex; align-items:center; gap:10px; margin-bottom:9px; color:#d9dcff; font-size:12px; font-weight:900; letter-spacing:3px; text-transform:uppercase; } 
.brand-mark{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 16px rgba(102,117,255,.65); }

.drop-zone:hover{ border-color:var(--accent); background:rgba(102,117,255,.06); }
#audioFileInput{ display:none; }
.btn{ appearance:none; display:inline-flex; align-items:center; justify-content:center; width:100%; min-height:48px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-weight:800; font-size:15px; cursor:pointer; text-decoration:none; margin-bottom:12px; transition:filter .2s; }
.btn:hover:not(:disabled){ filter:brightness(1.08); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-secondary{ background:#202027; border:1px solid #34343d; color:var(--muted); }

<body>

<div class="card">
  <div class="brand"><span class="brand-mark"></span>SANDCATFILMS</div>
  <h1>🎧 Extracción de Audios WAV Nativo</h1>
  <p>Extrae pistas de audio WAV sin pérdidas usando el motor nativo del navegador, compatible con tus anuncios activos.</p>
  
  <label class="drop-zone" id="dropZone" for="audioFileInput">
    <div style="font-size:28px; margin-bottom:6px;">🎵</div>
    <div style="font-weight:800; margin-bottom:4px;">Selecciona tus videos</div>
    <div style="color:var(--muted); font-size:13px;">O arrástralos y suéltalos aquí</div>
  </label>
  <input id="audioFileInput" type="file" accept="video/*,.mp4,.mov,.m4v,.avi,.mkv,.webm" multiple>

  <button class="btn" id="startAudioDownload" disabled>⬇️ Extraer y Descargar ZIP de Audios</button>
  <a href="/" class="btn btn-secondary">⬅️ Volver a ClipOrganizer AI</a>
  
  <div class="status" id="audioStatus">Esperando archivos de video...</div>
</div>

<!-- Librería JSZip oficial -->
<script src="https://jsdelivr.net"></script>
<script>
"use strict";

const audioFileInput = document.getElementById("audioFileInput");
const dropZone = document.getElementById("dropZone");
const startAudioDownload = document.getElementById("startAudioDownload");
const audioStatus = document.getElementById("audioStatus");

let selectedVideos = [];

function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function handleFiles(files) {
    selectedVideos = Array.from(files || []).filter(f => f.type.startsWith("video/") || /\.(mp4|mov|m4v|avi|mkv|webm)$/i.test(f.name));
    if (selectedVideos.length > 0) {
        audioStatus.textContent = `✅ ${selectedVideos.length} video(s) cargado(s) correctamente.`;
        startAudioDownload.disabled = false;
    } else {
        audioStatus.textContent = "❌ Por favor selecciona archivos de video válidos.";
        startAudioDownload.disabled = true;
    }
}

audioFileInput.addEventListener("change", e => handleFiles(e.target.files));
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.style.borderColor = "var(--accent)"; });
dropZone.addEventListener("dragleave", e => { e.preventDefault(); dropZone.style.borderColor = "#3a3a45"; });
dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.style.borderColor = "#3a3a45"; if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files); });

function bufferToWav(buffer) {
    let numOfChan = buffer.numberOfChannels,
        sampleRate = buffer.sampleRate,
        format = 1,
        bitDepth = 16;
    
    let resultBuffer;
    if (numOfChan === 2) {
        resultBuffer = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
    } else {
        resultBuffer = buffer.getChannelData(0);
    }
    
    let bufferLength = resultBuffer.length * (bitDepth / 8);
    let headerBuffer = new ArrayBuffer(44 + bufferLength);
    let view = new DataView(headerBuffer);
    
    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + bufferLength, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, format, true);
    view.setUint16(22, numOfChan, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numOfChan * (bitDepth / 8), true);
    view.setUint16(32, numOfChan * (bitDepth / 8), true);
    view.setUint16(34, bitDepth, true);
    writeString(view, 36, 'data');
    view.setUint32(40, bufferLength, true);
    
    let offset = 44;
    for (let i = 0; i < resultBuffer.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, resultBuffer[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    
    return new Blob([view], { type: 'audio/wav' });
}

function interleave(inputL, inputR) {
    let length = inputL.length + inputR.length;
    let result = new Float32Array(length);
    let index = 0, inputIndex = 0;
    while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
    }
    return result;
}

function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
    }
}

function decodificarVideo(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext({ sampleRate: 44100 });
            
            audioCtx.decodeAudioData(e.target.result, (audioBuffer) => {
                audioCtx.close();
                resolve(audioBuffer);
            }, (err) => {
                audioCtx.close();
                reject(new Error("Formato no soportado o video sin pista de audio ejecutable."));
            });
        };
        reader.onerror = () => reject(new Error("Error al procesar el archivo físico."));
        reader.readAsArrayBuffer(file);
    });
}

startAudioDownload.addEventListener("click", async () => {
    if (!selectedVideos.length) return;
    startAudioDownload.disabled = true;
    audioStatus.className = "status";

    try {
        const zip = new JSZip();
        const folderAudios = zip.folder("audios-de-tus-cats-😽❤️");

        for (let i = 0; i < selectedVideos.length; i++) {
            const file = selectedVideos[i];
            const number = String(i + 1).padStart(3, "0");
            const baseName = file.name.replace(/\.[^/.]+$/, "");
            
            audioStatus.textContent = `⌛ Extrayendo canales WAV (${i + 1} de ${selectedVideos.length}): ${file.name}...`;

            const audioBuffer = await decodificarVideo(file);
            const audioBlob = bufferToWav(audioBuffer);

            const audioName = `${number}_${baseName}.wav`;
            folderAudios.file(audioName, audioBlob, { compression: "STORE" });
        }

        audioStatus.textContent = "📦 Comprimiendo pistas en archivo ZIP...";
        const content = await zip.generateAsync({ type: "blob" });
        downloadBlob(content, `SANDCATFILMS_Audios_WAV_${Date.now()}.zip`);
        
        audioStatus.textContent = "✅ ¡Audios extraídos en WAV con éxito y sin afectar tus anuncios!";
        audioStatus.className = "status success";
    } catch (error) {
        console.error(error);
        audioStatus.textContent = `❌ Error en Extracción: ${error.message}`;
        audioStatus.className = "status error";
    } finally {
        startAudioDownload.disabled = false;
    }
});
</script>

</body>
